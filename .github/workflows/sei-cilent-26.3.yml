name: Build SEI HUB Cilent 26.3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o sei-hub-mod-26.3.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: gradle build --no-daemon
        working-directory: anchor-charge
      - uses: actions/upload-artifact@v4
        with:
          name: SEI-HUB
          path: anchor-charge/build/libs/sel-cilent-26.3.jar
