name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Find project
        id: p
        run: |
          f=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$f" ]; then echo "::error::settings.gradle.kts not found in repo"; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SEI-Launcher-v1
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
